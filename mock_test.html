<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <title>Mock Test</title>
  <style>
    :root {
      --bg: #FAFAFA;
      --card: #FFFFFF;
      --border: #E5E7EB;
      --text: #111827;
      --muted: #9CA3AF;
      --green: #16A34A;
      --green-bg: #F0FDF4;
      --red: #DC2626;
      --red-bg: #FEF2F2;
      --blue: #2563EB;
      --blue-bg: #EFF6FF;
      --amber: #D97706;
      --amber-bg: #FFFBEB;
      --shadow: 0 1px 3px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    /* Top Bar */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 800px; margin: 0 auto;
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .back-btn {
      width: 36px; height: 36px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; color: var(--text); font-size: 18px;
      transition: all 0.15s;
    }
    .back-btn:hover { background: var(--bg); }
    .brand h1 { font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .brand .sub { font-size: 13px; color: var(--muted); font-weight: 500; }
    .topbar-actions { display: flex; gap: 8px; }
    .top-btn {
      padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: all 0.15s;
      color: var(--text);
    }
    .top-btn:hover { border-color: var(--blue); color: var(--blue); }
    .top-btn.primary { background: var(--blue); color: white; border-color: var(--blue); }
    .top-btn.primary:hover { background: #1d4ed8; }

    .wrap { max-width: 800px; margin: 0 auto; padding: 24px 20px 80px; }

    /* Hero */
    .hero-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; margin-bottom: 24px;
      box-shadow: var(--shadow); text-align: center;
    }
    .hero-card h2 { font-size: 22px; font-weight: 800; margin-bottom: 8px; }
    .hero-card p { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .hero-stats {
      display: flex; justify-content: center; gap: 24px; margin-top: 16px;
    }
    .hero-stat { text-align: center; }
    .hero-stat .val { font-size: 24px; font-weight: 800; }
    .hero-stat .lbl {
      font-size: 11px; color: var(--muted); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Source Block */
    .source-block {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 28px; margin-bottom: 24px;
      box-shadow: var(--shadow);
    }
    .source-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
    }
    .source-num {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--blue); color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; flex-shrink: 0;
    }
    .source-label {
      font-size: 15px; font-weight: 700; color: var(--text);
      letter-spacing: -0.2px;
    }
    .source-word-count {
      font-size: 12px; font-weight: 600; color: var(--muted);
      background: var(--bg); padding: 2px 10px; border-radius: 999px;
      border: 1px solid var(--border);
    }
    .source-passage {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 22px;
      font-size: 16px; line-height: 2; color: var(--text);
      margin-bottom: 24px;
      font-family: 'Georgia', 'Times New Roman', serif;
    }
    .source-passage em {
      font-style: normal;
      background: linear-gradient(to top, rgba(250,204,21,0.30) 40%, transparent 40%);
      font-weight: 600;
      color: #92400e;
    }
    .source-passage { white-space: pre-wrap; }

    /* Word Sub-question */
    .word-sub {
      padding: 18px 0;
      border-top: 1px solid var(--border);
    }
    .word-sub:first-child { border-top: none; padding-top: 0; }
    .word-sub-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .word-sub-num {
      font-size: 13px; font-weight: 700; color: var(--muted);
    }
    .word-sub-word {
      font-size: 19px; font-weight: 800;
    }
    .word-sub-pos {
      font-size: 13px; font-weight: 600; color: var(--blue);
      background: var(--blue-bg); padding: 2px 10px; border-radius: 999px;
    }
    .word-sub textarea {
      width: 100%; min-height: 44px; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: 10px;
      font-size: 16px; font-family: 'Pretendard Variable', sans-serif;
      resize: vertical; transition: border-color 0.2s;
      background: var(--card);
    }
    .word-sub textarea:focus {
      outline: none; border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }
    .word-sub textarea:disabled {
      background: var(--bg); color: var(--muted);
    }

    /* Answer Reveal */
    .answer-reveal {
      display: none; margin-top: 10px; padding: 14px 16px;
      border-radius: 10px; line-height: 1.7;
      font-family: 'Pretendard Variable', sans-serif;
    }
    .answer-reveal.show { display: block; }
    .answer-reveal.correct {
      background: var(--green-bg); border: 1px solid #BBF7D0;
    }
    .answer-reveal .ans-label {
      font-weight: 700; font-size: 12px; color: var(--green);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .answer-reveal .ans-text {
      font-size: 16px; font-weight: 600; color: var(--green);
      margin-bottom: 4px;
    }
    .answer-reveal .ans-tips {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid #BBF7D0;
      color: #166534; font-size: 14px; line-height: 1.8;
    }
    .answer-reveal .ans-tips code {
      background: rgba(0,0,0,0.06);
      padding: 1px 5px; border-radius: 3px;
      font-size: 13px; font-family: 'Outfit', monospace;
    }

    /* Result badge on source block */
    .source-block .result-badge {
      display: none; float: right; font-size: 12px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px;
    }
    .source-block .result-badge.show { display: inline-block; }

    /* Score Ring */
    .score-ring {
      width: 120px; height: 120px; margin: 0 auto 20px; position: relative;
    }
    .score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .score-ring .bg { fill: none; stroke: var(--border); stroke-width: 8; }
    .score-ring .fill-ring {
      fill: none; stroke-width: 8; stroke-linecap: round;
      transition: stroke-dashoffset 1s ease;
    }
    .score-ring .score-text {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px; font-weight: 800;
    }
    .verdict { font-size: 18px; font-weight: 800; margin-bottom: 8px; }
    .verdict.excellent { color: var(--green); }
    .verdict.good { color: var(--amber); }
    .verdict.review { color: var(--red); }

    /* Show Results Button */
    .show-results-bar {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 14px 20px;
      text-align: center;
      animation: slideUp .3s ease;
    }
    .show-results-bar.show { display: block; }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .show-results-bar button {
      padding: 14px 48px; border: none; border-radius: 12px;
      background: var(--blue); color: white;
      font-size: 16px; font-weight: 800; font-family: inherit;
      cursor: pointer; transition: all 0.15s;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
    }
    .show-results-bar button:hover { background: #1d4ed8; }
    .show-results-bar .bar-hint {
      font-size: 12px; color: var(--muted); margin-bottom: 6px;
    }

    /* Final Results Overlay */
    .final-results-overlay {
      display: none; position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      overflow-y: auto;
      padding: 40px 20px;
    }
    .final-results-overlay.show { display: flex; align-items: center; justify-content: center; }
    .final-results-card {
      background: var(--card); border-radius: 20px;
      padding: 40px 32px; max-width: 480px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      text-align: center; position: relative;
      animation: cardSlideIn .4s ease;
    }
    .final-results-card .cert-badge {
      display: inline-block; font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); border: 1px solid var(--border);
      padding: 4px 14px; border-radius: 999px; margin-bottom: 20px;
    }
    .final-results-card .cert-title {
      font-size: 22px; font-weight: 800; margin-bottom: 4px;
    }
    .final-results-card .cert-date {
      font-size: 13px; color: var(--muted); margin-bottom: 24px;
    }
    .final-results-card .cert-stats {
      display: flex; justify-content: center; gap: 24px;
      margin: 20px 0 24px;
    }
    .final-results-card .cert-stat .val {
      font-size: 28px; font-weight: 800;
    }
    .final-results-card .cert-stat .val.green { color: var(--green); }
    .final-results-card .cert-stat .val.red { color: var(--red); }
    .final-results-card .cert-stat .lbl {
      font-size: 11px; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .final-results-card .cert-actions {
      display: flex; flex-direction: column; gap: 10px; margin-top: 24px;
    }
    .final-results-card .cert-actions button {
      width: 100%; padding: 14px; border-radius: 10px;
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: all 0.15s;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    .final-results-card .cert-actions button:hover {
      border-color: var(--blue); color: var(--blue);
    }
    .final-results-card .cert-actions button.primary {
      background: var(--blue); color: white; border-color: var(--blue);
    }
    .final-results-card .cert-actions button.primary:hover { background: #1d4ed8; }

    /* Self-grade buttons */
    .self-grade-row {
      display: none; margin-top: 10px;
      gap: 8px;
    }
    .self-grade-row.show { display: flex; }
    .self-grade-btn {
      flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
      font-size: 15px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: all 0.15s; background: var(--card);
    }
    .self-grade-btn.o { color: var(--green); }
    .self-grade-btn.o:hover { background: var(--green-bg); border-color: var(--green); }
    .self-grade-btn.x { color: var(--red); }
    .self-grade-btn.x:hover { background: var(--red-bg); border-color: var(--red); }
    .self-grade-btn.selected { pointer-events: none; }
    .self-grade-btn.o.selected { background: var(--green-bg); border-color: var(--green); }
    .self-grade-btn.x.selected { background: var(--red-bg); border-color: var(--red); }
    .self-grade-btn:not(.selected) { opacity: 0.3; }
    .self-grade-btn.pending { opacity: 1; }

    .hidden { display: none !important; }

    /* ── Mode Toggle ── */
    .mode-toggle-wrap {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 999px; padding: 5px 14px;
      font-size: 13px; font-weight: 700;
    }
    .mode-toggle-label { color: var(--muted); transition: color 0.2s; }
    .mode-toggle-label.active-label { color: var(--text); }
    .toggle-track {
      width: 40px; height: 22px; border-radius: 11px;
      background: var(--border); position: relative;
      cursor: pointer; transition: background 0.2s;
    }
    .toggle-track.on { background: var(--blue); }
    .toggle-knob {
      width: 18px; height: 18px; border-radius: 50%;
      background: white; position: absolute; top: 2px; left: 2px;
      box-shadow: 0 1px 3px rgba(0,0,0,.15);
      transition: transform 0.2s;
    }
    .toggle-track.on .toggle-knob { transform: translateX(18px); }

    /* ── Card Mode ── */
    body.card-mode .hero-card { display: none; }
    body.card-mode .source-block { display: none; }
    body.card-mode .source-block.card-active {
      display: block;
      animation: cardSlideIn .3s ease;
    }
    @keyframes cardSlideIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Card Nav Bar */
    .card-nav {
      display: none;
      position: sticky; top: 60px; z-index: 90;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      margin: 0 -20px 20px;
    }
    body.card-mode .card-nav { display: block; }
    .card-nav-inner {
      max-width: 800px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-nav-counter {
      font-size: 14px; font-weight: 700; color: var(--muted);
    }
    .card-nav-counter strong { color: var(--text); font-size: 18px; }
    .card-nav-score {
      display: flex; gap: 12px; font-size: 13px; font-weight: 700;
    }
    .card-nav-score .correct-count { color: var(--green); }
    .card-nav-score .wrong-count { color: var(--red); }
    .card-nav-btns {
      display: flex; gap: 8px;
    }
    .card-nav-btns button {
      padding: 8px 18px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--card); font-size: 13px; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: all 0.15s;
      color: var(--text);
    }
    .card-nav-btns button:hover { border-color: var(--blue); color: var(--blue); }
    .card-nav-btns button:disabled { opacity: 0.3; cursor: not-allowed; }
    .card-nav-btns button.primary { background: var(--blue); color: white; border-color: var(--blue); }
    .card-nav-btns button.primary:hover { background: #1d4ed8; }
    .card-nav-progress {
      height: 3px; background: var(--border); border-radius: 2px;
      margin-top: 10px; overflow: hidden;
    }
    .card-nav-progress .fill {
      height: 100%; background: var(--blue); border-radius: 2px;
      transition: width 0.3s ease;
    }

    /* Card mode: self-grade highlight */
    body.card-mode .source-block.graded-correct {
      border-color: var(--green);
      box-shadow: 0 0 0 1px var(--green), var(--shadow);
    }
    body.card-mode .source-block.graded-wrong {
      border-color: var(--red);
      box-shadow: 0 0 0 1px var(--red), var(--shadow);
    }

    /* Card Results Overlay */
    .card-results {
      display: none;
      animation: cardSlideIn .4s ease;
    }
    body.card-mode .card-results.show { display: block; }
    .card-results-inner {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 36px 28px;
      box-shadow: var(--shadow); text-align: center;
    }
    .card-results .cr-score { font-size: 48px; font-weight: 800; margin-bottom: 8px; }
    .card-results .cr-label { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .card-results .cr-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .card-results .cr-btns button {
      padding: 12px 24px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer; transition: all 0.15s;
    }
    .card-results .cr-btns button:hover { border-color: var(--blue); color: var(--blue); }
    .card-results .cr-btns button.primary { background: var(--blue); color: white; border-color: var(--blue); }

    @media (max-width: 600px) {
      .wrap { padding: 16px 14px 80px; }
      .source-block { padding: 20px 18px; }
      .source-passage { font-size: 15px; padding: 16px 18px; line-height: 1.9; }
      .word-sub-word { font-size: 17px; }
      .word-sub textarea { font-size: 15px; }
      .answer-reveal .ans-text { font-size: 15px; }
      .answer-reveal .ans-tips { font-size: 13px; }
      .topbar-inner { padding: 12px 16px; }
      .mode-toggle-wrap { padding: 4px 8px; }
      .mode-toggle-label { font-size: 11px; }
      .card-nav { padding: 10px 14px; margin: 0 -14px 16px; }
      body.card-mode .wrap { padding: 16px 14px 80px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <a href="index.html" class="back-btn">&larr;</a>
        <div>
          <h1 id="titleTop">Mock Test</h1>
          <div class="sub" id="subtitleTop"></div>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="mode-toggle-wrap">
          <span class="mode-toggle-label active-label" id="lblAll">전체</span>
          <div class="toggle-track" id="modeToggle">
            <div class="toggle-knob"></div>
          </div>
          <span class="mode-toggle-label" id="lblCard">카드</span>
        </div>
        <button class="top-btn" id="saveBtn">Save</button>
        <button class="top-btn primary" id="gradeBtn">Grade</button>
        <button class="top-btn" id="resetBtn" style="display:none;">Reset</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="hero-card" id="heroCard">
      <h2 id="heroTitle">Mock Test</h2>
      <p id="heroDesc">Source 지문을 읽고, 각 단어의 뜻을 작성하세요</p>
      <div class="hero-stats">
        <div class="hero-stat">
          <div class="val" id="statWords">0</div>
          <div class="lbl">단어</div>
        </div>
        <div class="hero-stat">
          <div class="val" id="statSources">0</div>
          <div class="lbl">지문</div>
        </div>
        <div class="hero-stat">
          <div class="val" id="statProgress">0</div>
          <div class="lbl">작성</div>
        </div>
      </div>
    </div>

    <div class="card-nav" id="cardNav">
      <div class="card-nav-inner">
        <div class="card-nav-counter">
          Source <strong id="cardCurrent">1</strong> / <span id="cardTotal">1</span>
        </div>
        <div class="card-nav-score">
          <span class="correct-count" id="cardCorrect">0</span> O
          <span class="wrong-count" id="cardWrong">0</span> X
        </div>
        <div class="card-nav-btns">
          <button id="cardPrevBtn" disabled>&larr;</button>
          <button id="cardNextBtn" class="primary">다음 &rarr;</button>
        </div>
      </div>
      <div class="card-nav-progress">
        <div class="fill" id="cardBarFill" style="width:0%"></div>
      </div>
    </div>

    <div id="questionsArea"></div>

    <div class="card-results" id="cardResults">
      <div class="card-results-inner">
        <div class="cr-score" id="crScore">0/0</div>
        <div class="cr-label">자기 채점 결과</div>
        <div class="cr-btns">
          <button class="primary" onclick="location.reload()">다시 시작</button>
          <button onclick="location.href='index.html'">홈으로</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Show Results Bar (fixed bottom) -->
  <div class="show-results-bar" id="showResultsBar">
    <div class="bar-hint">모든 단어의 자기 채점이 완료되었습니다</div>
    <button id="showResultsBtn">결과 보기</button>
  </div>

  <!-- Final Results Overlay -->
  <div class="final-results-overlay" id="finalResultsOverlay">
    <div class="final-results-card">
      <div class="cert-badge">Mock Test Certificate</div>
      <div class="cert-title" id="certTitle">Magoosh 1</div>
      <div class="cert-date" id="certDate"></div>
      <div class="score-ring">
        <svg viewBox="0 0 112 112">
          <circle class="bg" cx="56" cy="56" r="48"/>
          <circle class="fill-ring" cx="56" cy="56" r="48"
            stroke="var(--green)"
            stroke-dasharray="301.59"
            stroke-dashoffset="301.59"
            id="finalScoreRing"/>
        </svg>
        <div class="score-text" id="finalScoreText">0/0</div>
      </div>
      <div class="verdict" id="finalVerdict">EXCELLENT!</div>
      <div class="cert-stats">
        <div class="cert-stat">
          <div class="val green" id="finalCorrectCount">0</div>
          <div class="lbl">정답</div>
        </div>
        <div class="cert-stat">
          <div class="val red" id="finalWrongCount">0</div>
          <div class="lbl">오답</div>
        </div>
        <div class="cert-stat">
          <div class="val" id="finalTotalCount">0</div>
          <div class="lbl">전체</div>
        </div>
      </div>
      <div class="cert-actions">
        <button id="closeResultsBtn">돌아가기</button>
        <button onclick="localStorage.removeItem(STORAGE_KEY); location.reload();">다시 풀기</button>
        <button class="primary" onclick="location.href='index.html'">홈으로</button>
      </div>
    </div>
  </div>

  <script>
    // ── Config ──
    const urlParams = new URLSearchParams(window.location.search);
    const MOCK_ID = urlParams.get('mock') || 'magoosh_1';
    const STORAGE_KEY = `gre_mock_answers_${MOCK_ID}`;
    const displayName = MOCK_ID.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

    document.getElementById('titleTop').textContent = `Mock Test`;
    document.getElementById('subtitleTop').textContent = displayName;
    document.getElementById('heroTitle').textContent = displayName;

    let ALL_WORDS = [];
    let SOURCE_GROUPS = []; // { source, words[] }
    let isGraded = false;

    // ── Init ──
    async function init() {
      try {
        const res = await fetch(`data/Mock_${MOCK_ID}.json`);
        if (!res.ok) throw new Error('Not found');
        ALL_WORDS = await res.json();
        ALL_WORDS.forEach((w, i) => { w.id = String(i + 1).padStart(3, '0'); });
      } catch (e) {
        document.getElementById('heroTitle').textContent = '데이터를 불러올 수 없습니다';
        return;
      }

      // Group words by source text
      const sourceMap = new Map();
      for (const word of ALL_WORDS) {
        const src = (word.source && word.source[0]) || '(no source)';
        if (!sourceMap.has(src)) {
          sourceMap.set(src, []);
        }
        sourceMap.get(src).push(word);
      }
      SOURCE_GROUPS = Array.from(sourceMap.entries()).map(([source, words]) => ({ source, words }));

      document.getElementById('statWords').textContent = ALL_WORDS.length;
      document.getElementById('statSources').textContent = SOURCE_GROUPS.length;

      renderQuestions();
      restoreAnswers();
      updateProgress();
    }

    // ── Render ──
    function inflectPattern(word) {
      // Build regex pattern for a single English word that matches inflected forms
      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const suffixes = '(?:s|es|ed|d|ing|ment|ments|ly|er|ers|est|tion|tions|ness|ous|ive|al|ful|able|ible)?';
      const base = escaped;
      const baseNoE = base.endsWith('e') ? base.slice(0, -1) : null;
      if (baseNoE) {
        return `(?:${base}${suffixes}|${baseNoE}(?:ing|ed|er|ers|est|ation|ations))`;
      }
      const lastChar = base.slice(-1);
      const isConsonant = /[bcdfghjklmnpqrstvwxyz]/i.test(lastChar);
      if (isConsonant) {
        return `${base}(?:${lastChar}(?:ing|ed|er|ers|est))?${suffixes}`;
      }
      return `${base}${suffixes}`;
    }

    function highlightWordsInSource(source, words) {
      let html = source;
      const sorted = [...words].sort((a, b) => b.word.length - a.word.length);
      for (const w of sorted) {
        const rawParts = w.word.split(/\s+/);
        let pattern;
        if (rawParts.length > 1) {
          // Multi-word: apply inflection to each word in the phrase
          pattern = rawParts.map(p => inflectPattern(p)).join('\\s+');
        } else {
          pattern = inflectPattern(w.word);
        }
        const re = new RegExp(`\\b${pattern}\\b`, 'gi');
        html = html.replace(re, (match) => `<em>${match}</em>`);
      }
      return html;
    }

    function renderQuestions() {
      const area = document.getElementById('questionsArea');
      area.innerHTML = '';

      SOURCE_GROUPS.forEach((group, gIdx) => {
        const block = document.createElement('div');
        block.className = 'source-block';
        block.id = `source-${gIdx}`;

        const sourceHtml = highlightWordsInSource(group.source, group.words);

        let wordsHtml = '';
        group.words.forEach((word, wIdx) => {
          const globalIdx = ALL_WORDS.indexOf(word);
          const posHtml = word.pos ? `<span class="word-sub-pos">${word.pos}</span>` : '';
          wordsHtml += `
            <div class="word-sub" data-id="${word.id}">
              <div class="word-sub-header">
                <span class="word-sub-num">${globalIdx + 1}.</span>
                <span class="word-sub-word">${word.word}</span>
                ${posHtml}
              </div>
              <textarea id="ans-${word.id}" placeholder="뜻을 입력하세요" rows="1"></textarea>
              <div class="self-grade-row" id="grade-row-${word.id}">
                <button class="self-grade-btn o pending" data-id="${word.id}" data-val="o">O 맞음</button>
                <button class="self-grade-btn x pending" data-id="${word.id}" data-val="x">X 틀림</button>
              </div>
              <div class="answer-reveal" id="reveal-${word.id}">
                <div class="ans-label">정답</div>
                <div class="ans-text"></div>
                <div class="ans-tips"></div>
              </div>
            </div>
          `;
        });

        block.innerHTML = `
          <div class="source-header">
            <div class="source-num">${gIdx + 1}</div>
            <span class="source-label">Source ${gIdx + 1}</span>
            <span class="source-word-count">${group.words.length}개 단어</span>
          </div>
          <div class="source-passage">${sourceHtml}</div>
          <div class="words-area">${wordsHtml}</div>
        `;

        area.appendChild(block);
      });

      // Auto-resize textareas
      area.querySelectorAll('textarea').forEach(ta => {
        ta.addEventListener('input', () => {
          ta.style.height = 'auto';
          ta.style.height = ta.scrollHeight + 'px';
          debounceSave();
          updateProgress();
        });
      });

      // Self-grade button handlers
      area.querySelectorAll('.self-grade-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const val = btn.dataset.val;
          const row = document.getElementById(`grade-row-${id}`);
          row.querySelectorAll('.self-grade-btn').forEach(b => {
            b.classList.remove('pending', 'selected');
            if (b.dataset.val === val) b.classList.add('selected');
          });
          debounceSave();
          checkAllGraded();
        });
      });
    }

    // ── Progress ──
    function updateProgress() {
      const filled = ALL_WORDS.filter(w => {
        const ta = document.getElementById(`ans-${w.id}`);
        return ta && ta.value.trim().length > 0;
      }).length;
      document.getElementById('statProgress').textContent = filled;
    }

    // ── Save / Restore ──
    let saveTimer = null;
    function debounceSave() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveAnswers, 300);
    }

    function saveAnswers() {
      const data = {};
      ALL_WORDS.forEach(w => {
        const ta = document.getElementById(`ans-${w.id}`);
        const gradeRow = document.getElementById(`grade-row-${w.id}`);
        const selected = gradeRow?.querySelector('.self-grade-btn.selected');
        data[w.id] = {
          word: w.word,
          meaning: ta ? ta.value : '',
          selfGrade: selected ? selected.dataset.val : null
        };
      });
      data._meta = {
        mock: MOCK_ID,
        graded: isGraded,
        timestamp: new Date().toISOString()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function restoreAnswers() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        if (data._meta?.graded) {
          isGraded = true;
          // Restore answers then re-grade
          ALL_WORDS.forEach(w => {
            const saved = data[w.id];
            if (!saved) return;
            const ta = document.getElementById(`ans-${w.id}`);
            if (ta) {
              ta.value = saved.meaning || '';
              ta.style.height = 'auto';
              ta.style.height = ta.scrollHeight + 'px';
            }
          });
          gradeExam(data);
          return;
        }
        ALL_WORDS.forEach(w => {
          const saved = data[w.id];
          if (!saved) return;
          const ta = document.getElementById(`ans-${w.id}`);
          if (ta) {
            ta.value = saved.meaning || '';
            ta.style.height = 'auto';
            ta.style.height = ta.scrollHeight + 'px';
          }
        });
      } catch (e) {}
    }

    // ── Grade ──
    document.getElementById('gradeBtn').addEventListener('click', () => {
      if (isGraded) return;
      gradeExam();
    });

    function gradeExam(savedData) {
      isGraded = true;
      document.getElementById('gradeBtn').style.display = 'none';
      document.getElementById('resetBtn').style.display = '';

      // Disable all textareas
      document.querySelectorAll('.word-sub textarea').forEach(ta => {
        ta.disabled = true;
      });

      // Show answer reveals and self-grade buttons
      ALL_WORDS.forEach(w => {
        const reveal = document.getElementById(`reveal-${w.id}`);
        const gradeRow = document.getElementById(`grade-row-${w.id}`);
        if (!reveal) return;

        const meanings = w.head_meanings.join(' / ');
        const tips = (w.tips || [])
          .map(t => t.replace(/`([^`]+)`/g, '<code>$1</code>'))
          .join('<br>');

        reveal.querySelector('.ans-text').textContent = meanings;
        if (tips) {
          reveal.querySelector('.ans-tips').innerHTML = tips;
        }
        reveal.classList.add('show', 'correct');

        // Show self-grade buttons
        gradeRow.classList.add('show');

        // Restore self-grade if from saved data
        if (savedData && savedData[w.id]?.selfGrade) {
          const val = savedData[w.id].selfGrade;
          gradeRow.querySelectorAll('.self-grade-btn').forEach(b => {
            b.classList.remove('pending');
            if (b.dataset.val === val) b.classList.add('selected');
          });
        }
      });

      // Update hero
      document.getElementById('heroDesc').textContent = '정답을 확인하고, O/X로 자기 채점하세요';

      // Setup card mode grade tracking after grade buttons are visible
      setupCardModeGradeTracking();

      if (!savedData) saveAnswers();

      // Check if all already graded (restore case)
      checkAllGraded();
    }

    // ── Reset ──
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (!confirm('모든 답안을 초기화하시겠습니까?')) return;
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    });

    // ── Save button ──
    document.getElementById('saveBtn').addEventListener('click', saveAnswers);

    // ── Keyboard ──
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 's') {
        e.preventDefault();
        saveAnswers();
      }
      if (e.ctrlKey && e.key === 'g') {
        e.preventDefault();
        document.getElementById('gradeBtn').click();
      }
    });

    // ── Card Mode ──
    let isCardMode = false;
    let cardIdx = 0;
    let cardGradedCorrect = 0;
    let cardGradedWrong = 0;

    document.getElementById('modeToggle').addEventListener('click', toggleCardMode);

    function toggleCardMode() {
      isCardMode = !isCardMode;
      const track = document.getElementById('modeToggle');
      const lblAll = document.getElementById('lblAll');
      const lblCard = document.getElementById('lblCard');

      if (isCardMode) {
        document.body.classList.add('card-mode');
        track.classList.add('on');
        lblAll.classList.remove('active-label');
        lblCard.classList.add('active-label');
        enterCardMode();
      } else {
        document.body.classList.remove('card-mode');
        track.classList.remove('on');
        lblAll.classList.add('active-label');
        lblCard.classList.remove('active-label');
        exitCardMode();
      }
    }

    function enterCardMode() {
      cardIdx = 0;
      cardGradedCorrect = 0;
      cardGradedWrong = 0;
      document.getElementById('cardResults').classList.remove('show');

      // Count already-graded source blocks
      document.querySelectorAll('.source-block').forEach(block => {
        if (block.classList.contains('graded-correct')) cardGradedCorrect++;
        if (block.classList.contains('graded-wrong')) cardGradedWrong++;
      });

      showSourceCard(cardIdx);
    }

    function exitCardMode() {
      document.querySelectorAll('.source-block').forEach(b => b.classList.remove('card-active'));
      document.getElementById('cardResults').classList.remove('show');
    }

    function showSourceCard(idx) {
      if (idx < 0 || idx >= SOURCE_GROUPS.length) return;
      cardIdx = idx;

      document.querySelectorAll('.source-block').forEach(b => b.classList.remove('card-active'));
      const block = document.getElementById(`source-${idx}`);
      if (block) {
        block.classList.add('card-active');
        block.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      document.getElementById('cardCurrent').textContent = idx + 1;
      document.getElementById('cardTotal').textContent = SOURCE_GROUPS.length;
      document.getElementById('cardPrevBtn').disabled = idx === 0;

      const nextBtn = document.getElementById('cardNextBtn');
      if (idx === SOURCE_GROUPS.length - 1) {
        nextBtn.textContent = '결과 보기';
      } else {
        nextBtn.textContent = '다음 →';
      }

      updateCardNav();
    }

    function updateCardNav() {
      document.getElementById('cardCorrect').textContent = cardGradedCorrect;
      document.getElementById('cardWrong').textContent = cardGradedWrong;
      const graded = cardGradedCorrect + cardGradedWrong;
      const pct = SOURCE_GROUPS.length > 0 ? (graded / SOURCE_GROUPS.length) * 100 : 0;
      document.getElementById('cardBarFill').style.width = pct + '%';
    }

    function cardNext() {
      if (cardIdx < SOURCE_GROUPS.length - 1) {
        showSourceCard(cardIdx + 1);
      } else {
        // Show results
        showCardResults();
      }
    }

    function cardPrev() {
      if (cardIdx > 0) showSourceCard(cardIdx - 1);
    }

    function showCardResults() {
      document.querySelectorAll('.source-block').forEach(b => b.classList.remove('card-active'));
      const total = SOURCE_GROUPS.length;
      document.getElementById('crScore').textContent = `${cardGradedCorrect} / ${total}`;
      document.getElementById('cardResults').classList.add('show');
    }

    document.getElementById('cardNextBtn').addEventListener('click', cardNext);
    document.getElementById('cardPrevBtn').addEventListener('click', cardPrev);

    // Keyboard: arrow keys for card navigation
    document.addEventListener('keydown', (e) => {
      if (!isCardMode) return;
      if (e.target.tagName === 'TEXTAREA') return; // don't hijack while typing

      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        e.preventDefault();
        cardNext();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        e.preventDefault();
        cardPrev();
      }
    });

    // ── Check all graded → show results bar ──
    function checkAllGraded() {
      if (!isGraded) return;
      const allGraded = ALL_WORDS.every(w => {
        const row = document.getElementById(`grade-row-${w.id}`);
        return row && row.querySelector('.self-grade-btn.selected');
      });
      const bar = document.getElementById('showResultsBar');
      if (allGraded) {
        bar.classList.add('show');
      } else {
        bar.classList.remove('show');
      }
    }

    document.getElementById('showResultsBtn').addEventListener('click', showFinalResults);
    document.getElementById('closeResultsBtn').addEventListener('click', () => {
      document.getElementById('finalResultsOverlay').classList.remove('show');
    });
    document.getElementById('finalResultsOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('finalResultsOverlay')) {
        document.getElementById('finalResultsOverlay').classList.remove('show');
      }
    });

    function showFinalResults() {
      let correct = 0;
      let wrong = 0;
      ALL_WORDS.forEach(w => {
        const row = document.getElementById(`grade-row-${w.id}`);
        const sel = row?.querySelector('.self-grade-btn.selected');
        if (sel && sel.dataset.val === 'o') correct++;
        else wrong++;
      });

      const total = ALL_WORDS.length;
      const pct = Math.round((correct / total) * 100);

      // Score ring
      const r = 48;
      const c = 2 * Math.PI * r;
      const offset = c - (pct / 100) * c;
      const strokeColor = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--amber)' : 'var(--red)';

      const ring = document.getElementById('finalScoreRing');
      ring.setAttribute('stroke', strokeColor);
      ring.style.strokeDashoffset = c;

      document.getElementById('finalScoreText').textContent = `${correct}/${total}`;
      document.getElementById('finalCorrectCount').textContent = correct;
      document.getElementById('finalWrongCount').textContent = wrong;
      document.getElementById('finalTotalCount').textContent = total;

      let verdictClass, verdictText;
      if (pct >= 80) { verdictClass = 'excellent'; verdictText = 'EXCELLENT!'; }
      else if (pct >= 50) { verdictClass = 'good'; verdictText = 'KEEP GOING'; }
      else { verdictClass = 'review'; verdictText = 'NEED REVIEW'; }

      const verdict = document.getElementById('finalVerdict');
      verdict.className = `verdict ${verdictClass}`;
      verdict.textContent = verdictText;

      document.getElementById('certTitle').textContent = displayName;
      const now = new Date();
      document.getElementById('certDate').textContent =
        `${now.getFullYear()}. ${now.getMonth() + 1}. ${now.getDate()}. ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      document.getElementById('finalResultsOverlay').classList.add('show');

      // Animate ring after overlay visible
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          ring.style.strokeDashoffset = offset;
        });
      });

      // Save score to meta
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      data._meta = data._meta || {};
      data._meta.score = correct;
      data._meta.total = total;
      data._meta.completedAt = now.toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // When self-grade buttons are clicked in card mode, track card-level score
    function setupCardModeGradeTracking() {
      document.querySelectorAll('.self-grade-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!isCardMode) return;

          const wordId = btn.dataset.id;
          const val = btn.dataset.val;

          // Find which source block this word belongs to
          const wordSub = btn.closest('.word-sub');
          const sourceBlock = btn.closest('.source-block');
          if (!sourceBlock) return;

          // Check if ALL words in this source block have been graded
          const allGradeRows = sourceBlock.querySelectorAll('.self-grade-row');
          const allGraded = Array.from(allGradeRows).every(row => {
            return row.querySelector('.self-grade-btn.selected') !== null;
          });

          if (allGraded && !sourceBlock.dataset.cardGraded) {
            sourceBlock.dataset.cardGraded = '1';

            // Check if all are O
            const allCorrect = Array.from(allGradeRows).every(row => {
              const selected = row.querySelector('.self-grade-btn.selected');
              return selected && selected.dataset.val === 'o';
            });

            if (allCorrect) {
              sourceBlock.classList.add('graded-correct');
              cardGradedCorrect++;
            } else {
              sourceBlock.classList.add('graded-wrong');
              cardGradedWrong++;
            }
            updateCardNav();
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
