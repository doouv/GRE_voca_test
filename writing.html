<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>GRE Issue Task Trainer</title>
  <style>
    :root {
      --bg: #F7F8FA;
      --card: #FFFFFF;
      --border: #E2E5EA;
      --text: #1A1D23;
      --muted: #8590A2;
      --blue: #2563EB;
      --blue-light: #EFF6FF;
      --green: #16A34A;
      --amber: #D97706;
      --red: #DC2626;
      --shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.06);
      --serif: Georgia, 'Times New Roman', serif;
      --sans: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --mono: 'Courier New', Courier, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    /* ---- Browse Screen ---- */
    .browse-container { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
    .browse-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .browse-header h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.3px; }
    .back-link { font-size: 14px; color: var(--muted); text-decoration: none; font-weight: 600; }
    .back-link:hover { color: var(--blue); }
    .mode-toggle { display: flex; background: var(--border); border-radius: 8px; overflow: hidden; }
    .mode-toggle button { border: none; background: transparent; padding: 10px 20px; font: 600 14px var(--sans); color: var(--muted); cursor: pointer; transition: all .2s; }
    .mode-toggle button.active { background: var(--blue); color: #fff; }
    .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .random-start { border: none; background: var(--text); color: #fff; padding: 10px 20px; border-radius: 8px; font: 700 14px var(--sans); cursor: pointer; transition: all .2s; }
    .random-start:hover { opacity: .85; }
    .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
    .tabs button { border: none; background: transparent; padding: 8px 16px; font: 600 13px var(--sans); color: var(--muted); cursor: pointer; border-radius: 6px; transition: all .2s; }
    .tabs button.active { background: var(--blue-light); color: var(--blue); }
    .topic-list { display: flex; flex-direction: column; gap: 8px; }
    .topic-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; cursor: pointer; transition: all .2s; box-shadow: var(--shadow); }
    .topic-card:hover { border-color: var(--blue); transform: translateY(-1px); }
    .topic-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
    .topic-num { font-weight: 800; font-size: 14px; color: var(--blue); }
    .dir-badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--blue-light); color: var(--blue); white-space: nowrap; }
    .theme-badge { font-size: 11px; font-weight: 600; color: var(--muted); }
    .topic-preview { font-family: var(--serif); font-size: 14px; line-height: 1.6; color: #444; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .theme-group { margin-bottom: 20px; }
    .theme-group-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; cursor: pointer; flex-wrap: wrap; }
    .theme-group-header h3 { font-size: 15px; font-weight: 700; }
    .theme-group-header .count { font-size: 12px; color: var(--muted); }
    .theme-actions { display: flex; gap: 6px; }
    .theme-actions button { border: 1px solid var(--border); background: var(--card); padding: 4px 10px; border-radius: 6px; font: 600 11px var(--sans); cursor: pointer; transition: all .2s; }
    .theme-actions button:hover { border-color: var(--blue); color: var(--blue); }

    /* ---- Practice / Test screens ---- */
    .screen { display: none; }
    .screen.active { display: block; }
    .screen.active-flex { display: flex; }

    /* Practice common */
    .practice-container { max-width: 860px; margin: 0 auto; padding: 24px 20px; }
    .step-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .step-label { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .timer { font-family: var(--mono); font-size: 28px; font-weight: 700; }
    .timer.warning { color: var(--red); }
    .prompt-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .prompt-box .topic-num { margin-bottom: 8px; display: block; }
    .prompt-box .prompt-text { font-family: var(--serif); font-size: 15px; line-height: 1.8; }
    .prompt-box .direction-reveal { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .prompt-box .direction-reveal .dir-label { font-weight: 700; color: var(--blue); font-size: 14px; margin-bottom: 6px; }
    .prompt-box .direction-reveal .dir-instruction { font-family: var(--serif); font-size: 13px; line-height: 1.7; color: #555; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    .col-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; }
    textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 14px; font-family: var(--serif); font-size: 14px; line-height: 1.7; resize: vertical; min-height: 120px; transition: border-color .2s; }
    textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .position-btns { display: flex; gap: 12px; margin-bottom: 20px; }
    .position-btns button { flex: 1; padding: 14px; border: 2px solid var(--border); border-radius: 10px; background: var(--card); font: 700 15px var(--sans); cursor: pointer; transition: all .2s; }
    .position-btns button.selected { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }
    .nav-btn { border: none; padding: 14px 32px; border-radius: 8px; font: 700 15px var(--sans); cursor: pointer; transition: all .2s; }
    .nav-btn.primary { background: var(--blue); color: #fff; }
    .nav-btn.primary:disabled { opacity: .4; cursor: not-allowed; }
    .nav-btn.primary:not(:disabled):hover { background: #1d4ed8; }
    .nav-btn.secondary { background: var(--border); color: var(--text); }
    .nav-btn.secondary:hover { background: #d1d5db; }
    .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .outline-fields { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }
    .outline-field label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
    .collapsible-toggle { border: none; background: var(--blue-light); color: var(--blue); padding: 8px 14px; border-radius: 6px; font: 600 12px var(--sans); cursor: pointer; margin-bottom: 12px; }
    .collapsible-content { display: none; background: #FAFBFC; border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 16px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
    .collapsible-content.open { display: block; }
    .essay-area { min-height: 400px; font-size: 15px; line-height: 1.8; }
    .word-count { font-size: 13px; color: var(--muted); font-weight: 600; }

    /* Test mode */
    .test-screen { display: none; flex-direction: column; height: 100vh; }
    .test-screen.active-flex { display: flex; }
    .test-topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: #1A1D23; color: #fff; font-size: 14px; flex-shrink: 0; }
    .test-topbar .left { font-weight: 700; letter-spacing: .5px; }
    .test-topbar .right { display: flex; align-items: center; gap: 16px; }
    .test-topbar .timer { color: #fff; font-size: 20px; }
    .test-topbar button { border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; padding: 6px 14px; border-radius: 6px; font: 600 12px var(--sans); cursor: pointer; }
    .test-topbar button:hover { background: rgba(255,255,255,.1); }
    .test-body { flex: 1; display: flex; overflow: hidden; }
    .test-left { flex: 1; padding: 28px; overflow-y: auto; border-right: 1px solid var(--border); background: #FAFBFC; }
    .test-left .prompt-text { font-family: var(--serif); font-size: 15px; line-height: 1.8; }
    .test-left .dir-instruction { font-family: var(--serif); font-size: 13px; line-height: 1.7; color: #555; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .test-right { flex: 1; display: flex; flex-direction: column; }
    .test-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--card); flex-shrink: 0; }
    .test-toolbar button { border: 1px solid var(--border); background: var(--card); padding: 5px 12px; border-radius: 4px; font: 600 12px var(--sans); cursor: pointer; }
    .test-toolbar button:hover { background: var(--bg); }
    .test-toolbar .word-count { margin-left: auto; }
    .test-essay { flex: 1; border: none; border-radius: 0; padding: 24px; font-size: 15px; line-height: 1.9; resize: none; }
    .test-essay:focus { box-shadow: none; }
    .test-bottom { display: flex; align-items: center; justify-content: flex-end; padding: 10px 20px; border-top: 1px solid var(--border); background: var(--card); flex-shrink: 0; }

    /* Done screen */
    .done-container { max-width: 560px; margin: 80px auto; text-align: center; padding: 20px; }
    .done-container h2 { font-size: 28px; margin-bottom: 12px; }
    .done-container p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 28px; }
    .done-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* Responsive */
    @media (max-width: 700px) {
      .two-col { grid-template-columns: 1fr; }
      .test-body { flex-direction: column; }
      .test-left { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
      .browse-header { flex-direction: column; align-items: flex-start; }
    }

    /* Timer alert modal */
    .alert-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 9999; align-items: center; justify-content: center; }
    .alert-overlay.active { display: flex; }
    .alert-box { background: var(--card); border-radius: 12px; padding: 28px 32px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.2); max-width: 400px; }
    .alert-box p { font-size: 15px; margin-bottom: 16px; line-height: 1.5; }
    .alert-box button { border: none; background: var(--blue); color: #fff; padding: 10px 28px; border-radius: 8px; font: 600 14px var(--sans); cursor: pointer; }
  </style>
</head>
<body>

<!-- ===== BROWSE SCREEN ===== -->
<div class="screen active" id="browseScreen">
  <div class="browse-container">
    <div class="browse-header">
      <div>
        <a href="index.html" class="back-link">&larr; Back to Main</a>
        <h1>GRE Issue Task Trainer</h1>
      </div>
      <div class="mode-toggle">
        <button class="active" data-mode="practice">Practice</button>
        <button data-mode="test">Test</button>
      </div>
    </div>
    <div class="top-bar">
      <button class="random-start" id="randomTopicBtn">🎲 Random</button>
      <div class="tabs" id="browseTabs">
        <button class="active" data-tab="all">All</button>
        <button data-tab="theme">By Theme</button>
        <button data-tab="direction">By Direction</button>
      </div>
    </div>
    <div id="browseContent"></div>
  </div>
</div>

<!-- ===== PRACTICE SCREEN ===== -->
<div class="screen" id="practiceScreen">
  <!-- Step 1: Brainstorming -->
  <div class="screen active" id="step1" style="display:none">
    <div class="practice-container">
      <div class="step-header">
        <span class="step-label">Step 1 of 3 — Brainstorming</span>
        <span class="timer" id="timer1">5:00</span>
      </div>
      <div class="prompt-box">
        <span class="topic-num" id="s1Num"></span>
        <div class="prompt-text" id="s1Prompt"></div>
        <div id="s1ThemeLine" style="margin-top:8px; font-size:12px; color:var(--muted);"></div>
      </div>
      <div class="two-col">
        <div>
          <div class="col-label">Pro / 찬성</div>
          <textarea id="proBrain" placeholder="찬성 근거를 자유롭게 적으세요..."></textarea>
        </div>
        <div>
          <div class="col-label">Con / 반대</div>
          <textarea id="conBrain" placeholder="반대 근거를 자유롭게 적으세요..."></textarea>
        </div>
      </div>
      <div class="col-label" style="margin-bottom:6px;">Position 선택</div>
      <div class="position-btns">
        <button data-pos="agree" id="agreeBtn">Agree</button>
        <button data-pos="disagree" id="disagreeBtn">Disagree</button>
      </div>
      <div class="nav-row">
        <button class="nav-btn secondary" onclick="backToBrowse()">Cancel</button>
        <button class="nav-btn primary" id="toStep2Btn" disabled>Next &rarr;</button>
      </div>
    </div>
  </div>

  <!-- Step 2: Outline -->
  <div class="screen" id="step2" style="display:none">
    <div class="practice-container">
      <div class="step-header">
        <span class="step-label">Step 2 of 3 — Outline</span>
        <span class="timer" id="timer2">3:00</span>
      </div>
      <div class="prompt-box">
        <span class="topic-num" id="s2Num"></span>
        <div class="prompt-text" id="s2Prompt"></div>
        <div class="direction-reveal" id="s2Direction"></div>
      </div>
      <button class="collapsible-toggle" id="toggleBrain">Show Brainstorming Notes</button>
      <div class="collapsible-content" id="brainNotes"></div>
      <div class="outline-fields" id="outlineFields"></div>
      <div class="nav-row">
        <button class="nav-btn secondary" id="backToStep1">← Back</button>
        <button class="nav-btn primary" id="toStep3Btn">Next &rarr;</button>
      </div>
    </div>
  </div>

  <!-- Step 3: Write Essay -->
  <div class="screen" id="step3" style="display:none">
    <div class="practice-container">
      <div class="step-header">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
          <span class="step-label">Step 3 of 3 — Write Essay</span>
          <span class="word-count" id="practiceWC">0 words</span>
        </div>
        <span class="timer" id="timer3">30:00</span>
      </div>
      <div class="prompt-box" style="padding:16px 20px;">
        <span class="topic-num" id="s3Num" style="font-size:12px;"></span>
        <div class="prompt-text" id="s3Prompt" style="font-size:13px;"></div>
      </div>
      <button class="collapsible-toggle" id="toggleOutline">Show Outline & Notes</button>
      <div class="collapsible-content" id="outlineNotes"></div>
      <textarea class="essay-area" id="practiceEssay" placeholder="Write your essay here..."></textarea>
      <div class="nav-row" style="margin-top:16px;">
        <button class="nav-btn secondary" id="backToStep2">← Back</button>
        <button class="nav-btn primary" id="exportPracticeBtn">Export Essay</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== TEST SCREEN ===== -->
<div class="test-screen" id="testScreen">
  <div class="test-topbar">
    <div class="left">WRITING | Issue Task</div>
    <div class="right">
      <span class="timer" id="testTimer">30:00</span>
      <button id="hideTimeBtn">Hide Time</button>
      <button id="saveExitBtn">Save & Exit</button>
    </div>
  </div>
  <div class="test-body">
    <div class="test-left">
      <div class="prompt-text" id="testPrompt"></div>
      <div class="dir-instruction" id="testDirection"></div>
    </div>
    <div class="test-right">
      <div class="test-toolbar">
        <button id="cutBtn">Cut</button>
        <button id="pasteBtn">Paste</button>
        <button id="undoBtn">Undo</button>
        <button id="redoBtn">Redo</button>
        <span class="word-count" id="testWC">0 words</span>
      </div>
      <textarea class="test-essay" id="testEssay" placeholder="Write your essay here..."></textarea>
    </div>
  </div>
  <div class="test-bottom">
    <button class="nav-btn primary" id="exportTestBtn">Export Essay</button>
  </div>
</div>

<!-- ===== DONE SCREEN ===== -->
<div class="screen" id="doneScreen">
  <div class="done-container">
    <h2>Essay Exported</h2>
    <p>다운로드된 파일을 Claude에 올리면 GRE rubric으로 채점해줍니다.</p>
    <div class="done-actions">
      <button class="nav-btn primary" id="newTopicBtn">New Topic</button>
      <button class="nav-btn secondary" id="retryTopicBtn">Retry</button>
    </div>
  </div>
</div>

<!-- Timer alert -->
<div class="alert-overlay" id="alertOverlay">
  <div class="alert-box">
    <p id="alertMsg"></p>
    <button id="alertOk">OK</button>
  </div>
</div>

<script>
  // ===== DATA =====
  let DATA = null;
  let selectedMode = 'practice'; // 'practice' | 'test'
  let currentTopic = null;
  let position = null; // 'agree' | 'disagree'
  let timers = {};

  const BODY_LABELS = {
    'Agree/disagree statement': ['근거 1 + 예시', '근거 2 + 예시', '양보 (반대편 인정 → 재반박)'],
    'Challenge': ['내 근거 1 + 예시', '내 근거 2 + 예시', '가장 강한 반론 → 재반박'],
    'Both of the view': ['View 1 분석 + 예시', 'View 2 분석 + 예시', '내 최종 입장 + 이유'],
    'Claim/reason': ['Claim 평가 + 예시', 'Reason 평가 + 예시', 'Claim↔Reason 연결 평가'],
    'Recommendation': ['효과적인 상황 + 예시', '비효과적인 상황 + 예시', '전체적 판단 (weigh)'],
    'Policy': ['긍정적 결과 + 예시', '부정적 결과 + 예시', '결과 비교 + 판단']
  };

  async function loadData() {
    const res = await fetch('gre_issue_topics.json');
    DATA = await res.json();
    renderBrowse();
  }

  // ===== SCREENS =====
  function showOnly(id) {
    document.querySelectorAll('.screen, .test-screen').forEach(s => {
      s.classList.remove('active', 'active-flex');
      s.style.display = 'none';
    });
    const el = document.getElementById(id);
    if (id === 'testScreen') {
      el.style.display = '';
      el.classList.add('active-flex');
    } else {
      el.style.display = '';
      el.classList.add('active');
    }
  }

  function backToBrowse() {
    Object.values(timers).forEach(t => clearInterval(t.interval));
    timers = {};
    showOnly('browseScreen');
  }

  // ===== MODE TOGGLE =====
  document.querySelectorAll('.mode-toggle button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedMode = btn.dataset.mode;
    });
  });

  // ===== TABS =====
  document.querySelectorAll('#browseTabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#browseTabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderBrowse();
    });
  });

  // ===== BROWSE RENDERING =====
  function renderBrowse() {
    if (!DATA) return;
    const tab = document.querySelector('#browseTabs button.active').dataset.tab;
    const cont = document.getElementById('browseContent');

    if (tab === 'all') {
      cont.innerHTML = '';
      const list = document.createElement('div');
      list.className = 'topic-list';
      DATA.topics.forEach(t => list.appendChild(makeTopicCard(t)));
      cont.appendChild(list);
    } else if (tab === 'theme') {
      cont.innerHTML = '';
      const groups = {};
      DATA.topics.forEach(t => {
        const key = t.theme || '__independent__';
        if (!groups[key]) groups[key] = [];
        groups[key].push(t);
      });
      // named themes first, then independent
      const keys = Object.keys(groups).filter(k => k !== '__independent__').sort();
      if (groups['__independent__']) keys.push('__independent__');

      keys.forEach(key => {
        const topics = groups[key];
        const g = document.createElement('div');
        g.className = 'theme-group';
        const label = key === '__independent__' ? 'Independent Topics' : key;
        const labelKr = key === '__independent__' ? '독립 토픽' : (topics[0].theme_kr || '');
        g.innerHTML = `
          <div class="theme-group-header" data-theme="${key}">
            <h3>${label}</h3>
            ${labelKr && key !== '__independent__' ? `<span class="theme-badge">${labelKr}</span>` : ''}
            <span class="count">(${topics.length})</span>
            <div class="theme-actions">
              <button class="theme-random" data-theme="${key}">🎲 Random</button>
              <button class="theme-random-dir" data-theme="${key}">🔀 Random Direction</button>
            </div>
          </div>
          <div class="topic-list theme-topics" data-theme="${key}" style="display:none;"></div>
        `;
        cont.appendChild(g);
        const list = g.querySelector('.topic-list');
        topics.forEach(t => list.appendChild(makeTopicCard(t)));

        g.querySelector('.theme-group-header').addEventListener('click', (e) => {
          if (e.target.closest('.theme-actions')) return;
          list.style.display = list.style.display === 'none' ? 'flex' : 'none';
        });

        g.querySelector('.theme-random').addEventListener('click', (e) => {
          e.stopPropagation();
          const t = topics[Math.floor(Math.random() * topics.length)];
          startTopic(t);
        });

        g.querySelector('.theme-random-dir').addEventListener('click', (e) => {
          e.stopPropagation();
          const t = topics[Math.floor(Math.random() * topics.length)];
          const dirs = Object.keys(DATA.direction_templates);
          const randomDir = dirs[Math.floor(Math.random() * dirs.length)];
          startTopic({ ...t, direction: randomDir });
        });
      });
    } else if (tab === 'direction') {
      cont.innerHTML = '';
      const dirs = Object.keys(DATA.direction_templates);
      dirs.forEach(dir => {
        const topics = DATA.topics.filter(t => t.direction === dir);
        const g = document.createElement('div');
        g.className = 'theme-group';
        g.innerHTML = `
          <div class="theme-group-header">
            <h3>${dir}</h3>
            <span class="count">(${topics.length})</span>
          </div>
          <div class="topic-list" style="display:none;"></div>
        `;
        cont.appendChild(g);
        const list = g.querySelector('.topic-list');
        topics.forEach(t => list.appendChild(makeTopicCard(t)));
        g.querySelector('.theme-group-header').addEventListener('click', () => {
          list.style.display = list.style.display === 'none' ? 'flex' : 'none';
        });
      });
    }
  }

  function makeTopicCard(topic) {
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.innerHTML = `
      <div class="topic-card-top">
        <span class="topic-num">#${topic.number}</span>
        <span class="dir-badge">${topic.direction}</span>
        ${topic.theme_kr ? `<span class="theme-badge">${topic.theme_kr}</span>` : ''}
      </div>
      <div class="topic-preview">${topic.prompt}</div>
    `;
    card.addEventListener('click', () => startTopic(topic));
    return card;
  }

  // ===== RANDOM =====
  document.getElementById('randomTopicBtn').addEventListener('click', () => {
    const t = DATA.topics[Math.floor(Math.random() * DATA.topics.length)];
    startTopic(t);
  });

  // ===== START TOPIC =====
  function startTopic(topic) {
    currentTopic = topic;
    position = null;
    Object.values(timers).forEach(t => clearInterval(t.interval));
    timers = {};

    if (selectedMode === 'practice') {
      startPractice();
    } else {
      startTest();
    }
  }

  // ===== TIMER =====
  function createTimer(id, seconds, warningAt, onDone) {
    let remaining = seconds;
    const el = document.getElementById(id);
    const update = () => {
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      el.textContent = `${m}:${String(s).padStart(2, '0')}`;
      if (remaining <= warningAt) el.classList.add('warning');
      else el.classList.remove('warning');
    };
    update();
    const interval = setInterval(() => {
      remaining--;
      update();
      if (remaining <= 0) {
        clearInterval(interval);
        if (onDone) onDone();
      }
    }, 1000);
    timers[id] = { interval, remaining };
  }

  function showAlert(msg) {
    document.getElementById('alertMsg').textContent = msg;
    document.getElementById('alertOverlay').classList.add('active');
  }
  document.getElementById('alertOk').addEventListener('click', () => {
    document.getElementById('alertOverlay').classList.remove('active');
  });

  // ===== PRACTICE MODE =====
  function startPractice() {
    // Reset fields
    document.getElementById('proBrain').value = '';
    document.getElementById('conBrain').value = '';
    document.getElementById('practiceEssay').value = '';
    document.querySelectorAll('.position-btns button').forEach(b => b.classList.remove('selected'));
    document.getElementById('toStep2Btn').disabled = true;
    position = null;

    // Step 1
    document.getElementById('s1Num').textContent = `Topic #${currentTopic.number}`;
    document.getElementById('s1Prompt').textContent = currentTopic.prompt;
    document.getElementById('s1ThemeLine').textContent = currentTopic.theme_kr ? `Theme: ${currentTopic.theme_kr}` : '';

    showOnly('practiceScreen');
    showStep('step1');
    createTimer('timer1', 300, 60, () => showAlert('5분이 지났습니다. 준비되면 다음 단계로 넘어가세요.'));
  }

  function showStep(id) {
    ['step1', 'step2', 'step3'].forEach(s => {
      document.getElementById(s).style.display = s === id ? 'block' : 'none';
    });
  }

  // Position buttons
  document.querySelectorAll('.position-btns button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.position-btns button').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      position = btn.dataset.pos;
      document.getElementById('toStep2Btn').disabled = false;
    });
  });

  // Step 1 → 2
  document.getElementById('toStep2Btn').addEventListener('click', () => {
    if (timers['timer1']) clearInterval(timers['timer1'].interval);

    // Fill step 2
    document.getElementById('s2Num').textContent = `Topic #${currentTopic.number}`;
    document.getElementById('s2Prompt').textContent = currentTopic.prompt;

    const dirHtml = `
      <div class="dir-label">${currentTopic.direction}</div>
      <div class="dir-instruction">${DATA.direction_templates[currentTopic.direction]}</div>
    `;
    document.getElementById('s2Direction').innerHTML = dirHtml;

    // Build outline fields
    const labels = BODY_LABELS[currentTopic.direction] || ['Body 1', 'Body 2', 'Body 3'];
    const fields = document.getElementById('outlineFields');
    fields.innerHTML = `
      <div class="outline-field"><label>INTRO</label><textarea id="outIntro" rows="3" placeholder="Introduction..."></textarea></div>
      ${labels.map((l, i) => `<div class="outline-field"><label>BODY ${i + 1}: ${l}</label><textarea id="outBody${i}" rows="3" placeholder="${l}"></textarea></div>`).join('')}
      <div class="outline-field"><label>CONCLUSION</label><textarea id="outConc" rows="3" placeholder="Conclusion..."></textarea></div>
    `;

    showStep('step2');
    createTimer('timer2', 180, 30, () => showAlert('3분이 지났습니다. 준비되면 다음 단계로 넘어가세요.'));
  });

  // Brainstorming notes toggle
  document.getElementById('toggleBrain').addEventListener('click', () => {
    const notes = document.getElementById('brainNotes');
    const pro = document.getElementById('proBrain').value;
    const con = document.getElementById('conBrain').value;
    notes.textContent = `Position: ${position ? position.toUpperCase() : '-'}\n\n[PRO]\n${pro || '(없음)'}\n\n[CON]\n${con || '(없음)'}`;
    notes.classList.toggle('open');
  });

  // Step 2 → 1
  document.getElementById('backToStep1').addEventListener('click', () => {
    if (timers['timer2']) clearInterval(timers['timer2'].interval);
    showStep('step1');
  });

  // Step 2 → 3
  document.getElementById('toStep3Btn').addEventListener('click', () => {
    if (timers['timer2']) clearInterval(timers['timer2'].interval);

    document.getElementById('s3Num').textContent = `Topic #${currentTopic.number}`;
    document.getElementById('s3Prompt').textContent = currentTopic.prompt;
    document.getElementById('practiceEssay').value = '';
    updatePracticeWC();

    showStep('step3');
    createTimer('timer3', 1800, 300, () => showAlert('30분이 지났습니다.'));
  });

  // Outline toggle (step 3)
  document.getElementById('toggleOutline').addEventListener('click', () => {
    const notes = document.getElementById('outlineNotes');
    const pro = document.getElementById('proBrain').value;
    const con = document.getElementById('conBrain').value;
    const labels = BODY_LABELS[currentTopic.direction] || ['Body 1', 'Body 2', 'Body 3'];

    let outline = `Position: ${position ? position.toUpperCase() : '-'}\n\n`;
    outline += `[PRO] ${pro || '(없음)'}\n[CON] ${con || '(없음)'}\n\n`;
    outline += `--- OUTLINE ---\n`;
    const intro = document.getElementById('outIntro');
    outline += `[Intro] ${intro ? intro.value : ''}\n`;
    labels.forEach((l, i) => {
      const el = document.getElementById(`outBody${i}`);
      outline += `[Body ${i + 1}: ${l}] ${el ? el.value : ''}\n`;
    });
    const conc = document.getElementById('outConc');
    outline += `[Conclusion] ${conc ? conc.value : ''}`;
    notes.textContent = outline;
    notes.classList.toggle('open');
  });

  // Step 3 → 2
  document.getElementById('backToStep2').addEventListener('click', () => {
    if (timers['timer3']) clearInterval(timers['timer3'].interval);
    showStep('step2');
  });

  // Word count
  function countWords(text) { return text.trim() ? text.trim().split(/\s+/).length : 0; }
  function updatePracticeWC() {
    document.getElementById('practiceWC').textContent = countWords(document.getElementById('practiceEssay').value) + ' words';
  }
  document.getElementById('practiceEssay').addEventListener('input', updatePracticeWC);

  // ===== TEST MODE =====
  function startTest() {
    document.getElementById('testPrompt').textContent = currentTopic.prompt;
    document.getElementById('testDirection').textContent = DATA.direction_templates[currentTopic.direction];
    document.getElementById('testEssay').value = '';
    updateTestWC();

    showOnly('testScreen');
    createTimer('testTimer', 1800, 300, () => showAlert('30분이 지났습니다.'));
  }

  function updateTestWC() {
    document.getElementById('testWC').textContent = countWords(document.getElementById('testEssay').value) + ' words';
  }
  document.getElementById('testEssay').addEventListener('input', updateTestWC);

  // Toolbar buttons
  document.getElementById('cutBtn').addEventListener('click', () => document.execCommand('cut'));
  document.getElementById('pasteBtn').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      const ta = document.getElementById('testEssay');
      const s = ta.selectionStart, e = ta.selectionEnd;
      ta.value = ta.value.slice(0, s) + text + ta.value.slice(e);
      ta.selectionStart = ta.selectionEnd = s + text.length;
      updateTestWC();
    } catch {}
  });
  document.getElementById('undoBtn').addEventListener('click', () => document.execCommand('undo'));
  document.getElementById('redoBtn').addEventListener('click', () => document.execCommand('redo'));

  // Hide time
  let timeHidden = false;
  document.getElementById('hideTimeBtn').addEventListener('click', () => {
    timeHidden = !timeHidden;
    document.getElementById('testTimer').style.visibility = timeHidden ? 'hidden' : 'visible';
    document.getElementById('hideTimeBtn').textContent = timeHidden ? 'Show Time' : 'Hide Time';
  });

  // Save & Exit
  document.getElementById('saveExitBtn').addEventListener('click', () => {
    if (confirm('Exit test? Your essay will not be saved unless you export it.')) backToBrowse();
  });

  // ===== EXPORT =====
  function buildExportText(essay, isPractice) {
    const wc = countWords(essay);
    let text = `GRE ISSUE ESSAY — FOR GRADING\n${'='.repeat(50)}\n\n`;
    text += `TOPIC #${currentTopic.number}\n${currentTopic.prompt}\n\n`;
    text += `DIRECTION: ${currentTopic.direction}\n`;
    text += `THEME: ${currentTopic.theme || 'Independent'}\n\n`;

    if (isPractice) {
      text += `${'='.repeat(50)}\nBRAINSTORMING\n${'='.repeat(50)}\n`;
      text += `Position: ${position ? position.toUpperCase() : '-'}\n\n`;
      text += `[PRO]\n${document.getElementById('proBrain').value || '(empty)'}\n\n`;
      text += `[CON]\n${document.getElementById('conBrain').value || '(empty)'}\n\n`;

      const labels = BODY_LABELS[currentTopic.direction] || ['Body 1', 'Body 2', 'Body 3'];
      text += `${'='.repeat(50)}\nOUTLINE\n${'='.repeat(50)}\n`;
      const intro = document.getElementById('outIntro');
      text += `[Intro] ${intro ? intro.value : ''}\n`;
      labels.forEach((l, i) => {
        const el = document.getElementById(`outBody${i}`);
        text += `[Body ${i + 1}: ${l}] ${el ? el.value : ''}\n`;
      });
      const conc = document.getElementById('outConc');
      text += `[Conclusion] ${conc ? conc.value : ''}\n\n`;
    }

    text += `${'='.repeat(50)}\nESSAY (${wc} words)\n${'='.repeat(50)}\n${essay}\n\n`;
    text += `${'='.repeat(50)}\nGRADING INSTRUCTIONS:\n`;
    text += `Evaluate this GRE Issue essay on the official ETS 0-6 rubric.\n`;
    text += `Score each criterion and give specific feedback:\n`;
    text += `1. Responding to the direction: "${currentTopic.direction}"\n`;
    text += `2. Considering complexities of the issue\n`;
    text += `3. Organization, development, expression\n`;
    text += `4. Supporting position with reasons/examples\n`;
    text += `5. Control of standard written English\n`;
    text += `Give an overall holistic score with detailed commentary.\n`;
    text += `Point out specific sentences to improve with suggested revisions.\n`;
    text += `Note recurring grammar/collocation errors.\n`;
    return text;
  }

  function downloadTxt(content, filename) {
    const blob = new Blob([content], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  document.getElementById('exportPracticeBtn').addEventListener('click', () => {
    const essay = document.getElementById('practiceEssay').value;
    const text = buildExportText(essay, true);
    downloadTxt(text, `GRE_Issue_${currentTopic.number}_practice.txt`);
    Object.values(timers).forEach(t => clearInterval(t.interval));
    timers = {};
    showOnly('doneScreen');
  });

  document.getElementById('exportTestBtn').addEventListener('click', () => {
    const essay = document.getElementById('testEssay').value;
    const text = buildExportText(essay, false);
    downloadTxt(text, `GRE_Issue_${currentTopic.number}_test.txt`);
    Object.values(timers).forEach(t => clearInterval(t.interval));
    timers = {};
    showOnly('doneScreen');
  });

  // ===== DONE =====
  document.getElementById('newTopicBtn').addEventListener('click', backToBrowse);
  document.getElementById('retryTopicBtn').addEventListener('click', () => {
    if (currentTopic) startTopic(currentTopic);
  });

  // ===== INIT =====
  loadData();
</script>
</body>
</html>
